# Firebase App Hosting — requires Blaze plan
# Set secrets with: npx -y firebase-tools@latest apphosting:secrets:set NAME --project vapelizer-store

runConfig:
  cpu: 1
  memoryMiB: 1024
  minInstances: 0
  maxInstances: 20
  concurrency: 80

env:
  - variable: FIREBASE_DATABASE_ID
    value: vapelizer
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: vapelizer-store
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: vapelizer-store.firebaseapp.com
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: vapelizer-store.firebasestorage.app
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "31403529621"
  - variable: NEXTAUTH_URL
    secret: NEXTAUTH_URL
    availability: [BUILD, RUNTIME]
  - variable: AUTH_SECRET
    secret: AUTH_SECRET
    availability: [BUILD, RUNTIME]
  - variable: NEXTAUTH_SECRET
    secret: NEXTAUTH_SECRET
    availability: [BUILD, RUNTIME]
  - variable: ADMIN_EMAIL
    secret: ADMIN_EMAIL
    availability: [RUNTIME]
  - variable: ADMIN_PASSWORD
    secret: ADMIN_PASSWORD
    availability: [RUNTIME]
  - variable: NEXT_PUBLIC_WHATSAPP_NUMBER
    secret: NEXT_PUBLIC_WHATSAPP_NUMBER
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    secret: NEXT_PUBLIC_FIREBASE_API_KEY
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    secret: NEXT_PUBLIC_FIREBASE_APP_ID
    availability: [BUILD, RUNTIME]
  - variable: FIREBASE_SERVICE_ACCOUNT_JSON
    secret: FIREBASE_SERVICE_ACCOUNT_JSON
    availability: [BUILD, RUNTIME]
  - variable: CLOUDINARY_CLOUD_NAME
    secret: CLOUDINARY_CLOUD_NAME
    availability: [RUNTIME]
  - variable: CLOUDINARY_API_KEY
    secret: CLOUDINARY_API_KEY
    availability: [RUNTIME]
  - variable: CLOUDINARY_API_SECRET
    secret: CLOUDINARY_API_SECRET
    availability: [RUNTIME]
